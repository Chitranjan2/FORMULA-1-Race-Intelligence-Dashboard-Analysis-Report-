name: Python CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile Python sources
        run: python -m compileall -q src app tests

      - name: Import smoke test
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import f1intel, f1intel.analysis, f1intel.strategy, f1intel.model, f1intel.build, f1intel.report; print('package imports OK', f1intel.__version__)"
